<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="dining-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5DEC9" />
      <stop offset="100%" stop-color="#CFC4AC" />
    </linearGradient>
    <linearGradient id="dining-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B7873" />
      <stop offset="100%" stop-color="#4C4844" />
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <polygon points="0,0 1000,0 850,70 150,70" fill="#FAF8F5" />
  <!-- Left Wall -->
  <polygon points="0,0 150,70 150,520 0,610" fill="#BCB199" />
  <!-- Right Wall with Tall Arch -->
  <polygon points="1000,0 850,70 850,520 1000,610" fill="#C2B7A0" />
  <!-- Back Architectural Plaster Wall -->
  <rect x="150" y="70" width="700" height="450" fill="url(#dining-wall)" />

  <!-- Architectural Large Wall Arch Opening / Recess -->
  <path d="M 320 520 L 320 220 A 180 180 0 0 1 680 220 L 680 520 Z" fill="#D3C7AE" stroke="#FAF8F5" stroke-width="4" />

  <!-- Sculptural Brass Chandelier -->
  <line x1="500" y1="70" x2="500" y2="200" stroke="#C3A77D" stroke-width="3" />
  <circle cx="500" cy="210" r="45" fill="none" stroke="#C3A77D" stroke-width="4" />
  <circle cx="460" cy="210" r="12" fill="#FFF3D4" />
  <circle cx="540" cy="210" r="12" fill="#FFF3D4" />

  <!-- Floor (Polished Concrete / Terrazzo) -->
  <polygon points="0,610 150,520 850,520 1000,610 1000,650 0,650" fill="url(#dining-floor)" />

  <!-- Modernist Dining Table -->
  <ellipse cx="500" cy="460" rx="260" ry="40" fill="#EAE5DE" stroke="#D3CDC4" stroke-width="3" />
  <rect x="470" y="460" width="60" height="110" fill="#3D3731" rx="4" />

  <!-- Designer Chairs -->
  <!-- Left Chair -->
  <rect x="260" y="380" width="45" height="110" rx="8" fill="#C3A77D" />
  <line x1="282" y1="470" x2="270" y2="550" stroke="#333" stroke-width="3" />
  <!-- Right Chair -->
  <rect x="695" y="380" width="45" height="110" rx="8" fill="#C3A77D" />
  <line x1="718" y1="470" x2="730" y2="550" stroke="#333" stroke-width="3" />

  <!-- Table Vase & Botanicals -->
  <ellipse cx="500" cy="445" rx="16" ry="25" fill="#FFFFFF" stroke="#C3A77D" stroke-width="2" />
  <line x1="500" y1="420" x2="480" y2="350" stroke="#445544" stroke-width="2" />
  <circle cx="480" cy="350" r="6" fill="#D9B8CE" />
  <line x1="500" y1="420" x2="520" y2="340" stroke="#445544" stroke-width="2" />
  <circle cx="520" cy="340" r="7" fill="#74608F" />
</svg>

