<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="study-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2DCD2" />
      <stop offset="100%" stop-color="#CAC2B4" />
    </linearGradient>
    <linearGradient id="study-floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A4738" />
      <stop offset="100%" stop-color="#3A2C21" />
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <polygon points="0,0 1000,0 860,70 140,70" fill="#F8F6F2" />
  <!-- Left Wall with Bookcase perspective -->
  <polygon points="0,0 140,70 140,500 0,590" fill="#B2A898" />
  <!-- Right Wall -->
  <polygon points="1000,0 860,70 860,500 1000,590" fill="#BDB3A3" />
  <!-- Back Architectural Wall -->
  <rect x="140" y="70" width="720" height="430" fill="url(#study-wall)" />

  <!-- Built-in Shelving System on Left -->
  <rect x="160" y="90" width="220" height="380" fill="#2E241E" rx="4" />
  <!-- Shelves -->
  <rect x="165" y="150" width="210" height="8" fill="#C3A77D" />
  <rect x="165" y="220" width="210" height="8" fill="#C3A77D" />
  <rect x="165" y="290" width="210" height="8" fill="#C3A77D" />
  <rect x="165" y="360" width="210" height="8" fill="#C3A77D" />
  <!-- Books -->
  <rect x="175" y="115" width="16" height="35" fill="#74608F" />
  <rect x="195" y="110" width="22" height="40" fill="#C3A77D" />
  <rect x="220" y="120" width="14" height="30" fill="#D9B8CE" />
  <rect x="175" y="180" width="30" height="40" fill="#4B655C" />

  <!-- Architectural Art on Right Wall -->
  <rect x="480" y="110" width="320" height="200" fill="#FAF7F2" stroke="#C3A77D" stroke-width="4" rx="2" />
  <circle cx="640" cy="210" r="50" fill="#E8DED3" />
  <rect x="580" y="170" width="120" height="80" fill="none" stroke="#74608F" stroke-width="3" />

  <!-- Floor -->
  <polygon points="0,590 140,500 860,500 1000,590 1000,650 0,650" fill="url(#study-floor)" />

  <!-- Executive Oak Desk -->
  <rect x="420" y="380" width="400" height="15" fill="#D2A478" stroke="#3D2B1D" stroke-width="2" rx="3" />
  <!-- Desk Base / Drawers -->
  <rect x="450" y="395" width="90" height="110" fill="#8C5C38" />
  <rect x="700" y="395" width="90" height="110" fill="#8C5C38" />
  <rect x="540" y="395" width="160" height="20" fill="#784B28" />

  <!-- Brass Desk Lamp -->
  <ellipse cx="480" cy="380" rx="14" ry="4" fill="#C3A77D" />
  <path d="M480 380 Q 480 340 510 330" fill="none" stroke="#C3A77D" stroke-width="4" />
  <ellipse cx="515" cy="330" rx="18" ry="8" fill="#C3A77D" />
  <circle cx="515" cy="336" r="16" fill="#FFF3D4" opacity="0.4" />

  <!-- Leather Swivel Chair -->
  <rect x="575" y="330" width="90" height="90" rx="12" fill="#231914" stroke="#C3A77D" stroke-width="2" />
  <rect x="615" y="420" width="10" height="70" fill="#C3A77D" />
</svg>

